[build]
  publish = "."

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# Build sources, repo notes and editor files are not part of the site: answer 404 so they are never indexed.
[[redirects]]
  from = "/tools/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.claude/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/DESIGN.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/PRODUCT.md"
  to = "/404.html"
  status = 404
  force = true


[[redirects]]
  from = "/SEO.md"
  to = "/404.html"
  status = 404
  force = true
