[build]
  publish = "."

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# Build sources, repo notes and editor files are not part of the site: answer 404 so they are never indexed.
[[redirects]]
  from = "/tools/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.claude/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/DESIGN.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/PRODUCT.md"
  to = "/404.html"
  status = 404
  force = true


[[redirects]]
  from = "/SEO.md"
  to = "/404.html"
  status = 404
  force = true

# MoneyBee Lite, the site for small businesses, is its own Netlify project that keeps its pages under /lite/.
# These two rules serve it at moneybee.world/lite, so the address bar stays on moneybee.world.
[[redirects]]
  from = "/lite"
  to = "https://moneybee-lite.netlify.app/lite/"
  status = 200
  force = true

[[redirects]]
  from = "/lite/*"
  to = "https://moneybee-lite.netlify.app/lite/:splat"
  status = 200
  force = true
